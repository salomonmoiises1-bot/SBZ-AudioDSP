name: Build SB APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build SB Native Android DSP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore and verify Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl --fail --silent --show-error --location \
            https://services.gradle.org/distributions/gradle-8.5-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar
          curl --fail --silent --show-error --location \
            https://services.gradle.org/distributions/gradle-8.5-wrapper.jar.sha256 \
            --output gradle/wrapper/gradle-wrapper.jar.sha256
          cd gradle/wrapper
          echo "  gradle-wrapper.jar" >> gradle-wrapper.jar.sha256
          sha256sum --check gradle-wrapper.jar.sha256
          test -s gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and verify SB.apk
        run: |
          mkdir -p release-output
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} release-output/SB.apk \;
          ls -la release-output/

      - name: Upload SB.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SB.apk
          path: release-output/SB.apk
          if-no-files-found: error
