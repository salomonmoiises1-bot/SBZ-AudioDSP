name: Build SB APK

on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build:
name: Build SB Native Android DSP
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: gradle

  - name: Set up Gradle 8.5
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.5'

  - name: Verify Java and Gradle
    run: |
      java -version
      gradle --version

  - name: Run Unit Tests
    run: gradle test --stacktrace

  - name: Build Release APK
    run: gradle assembleRelease --stacktrace

  - name: Locate and verify SB.apk
    run: |
      mkdir -p release-output
      find app/build/outputs/apk -type f -name "*.apk" -exec cp {} release-output/SB.apk \;
      test -s release-output/SB.apk
      ls -lh release-output/SB.apk

  - name: Upload SB.apk Artifact
    uses: actions/upload-artifact@v4
    with:
      name: SB.apk
      path: release-output/SB.apk
      if-no-files-found: error
